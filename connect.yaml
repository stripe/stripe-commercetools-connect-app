deployAs:
  - name: enabler
    applicationType: assets
  - name: processor
    applicationType: service
    endpoint: /
    scripts:
      postDeploy: npm install && npm run connector:post-deploy
      preUndeploy: npm install && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CTP_PROJECT_KEY
          description: commercetools project key
          required: true
        - key: CTP_AUTH_URL
          description: commercetools Auth URL (example - https://auth.europe-west1.gcp.commercetools.com).
          required: true
          default: https://auth.europe-west1.gcp.commercetools.com
        - key: CTP_API_URL
          description: commercetools API URL (example - https://api.europe-west1.gcp.commercetools.com).
          required: true
          default: https://api.europe-west1.gcp.commercetools.com
        - key: CTP_SESSION_URL
          description: Session API URL (example - https://session.europe-west1.gcp.commercetools.com).
          required: true
          default: https://session.europe-west1.gcp.commercetools.com
        - key: CTP_CHECKOUT_URL
          description: Checkout API URL (example - https://checkout.europe-west1.gcp.commercetools.com).
          required: true
        - key: CTP_JWKS_URL
          description: JWKs url (example - https://mc-api.europe-west1.gcp.commercetools.com/.well-known/jwks.json)
          required: true
          default: https://mc-api.europe-west1.gcp.commercetools.com/.well-known/jwks.json
        - key: CTP_JWT_ISSUER
          description: JWT Issuer for jwt validation (example - https://mc-api.europe-west1.gcp.commercetools.com)
          required: true
          default: https://mc-api.europe-west1.gcp.commercetools.com
        - key: STRIPE_CAPTURE_METHOD
          description: Stripe capture method (example - manual|automatic).
          default: automatic
        - key: STRIPE_PAYMENT_FLOW
          description: 'Optional. Stripe Elements initialization strategy - deferred|pi_first. Unset means deferred, which creates Elements with mode/amount/currency and the PaymentIntent at submit time. pi_first creates the PaymentIntent before the Element mounts and initializes Elements with its clientSecret, which bank transfers (customer_balance) and BLIK need. The frontend now does this - but STILL DO NOT SET pi_first, for two reasons that are both open and neither of which is a frontend gap. FIRST, opening the payment page is now enough to create a PaymentIntent, create a commercetools Payment and FREEZE THE CART, before the shopper picks a method or clicks anything. There is no unfreeze-on-abandonment path, and a storefront that clears a non-Active cart will empty the basket when the shopper returns. PaymentIntent creation has no deterministic idempotency key, so any remount orphans the previous PaymentIntent and CT Payment. SECOND, confirmation validates the PaymentIntent amount against a snapshot taken when it was created, never against the cart current total - under pi_first that window is the whole page lifetime, and the shipping-methods endpoints can change the total inside it, so a cart can be paid at less than it is worth. Also live regardless of the above: pi_first DISCARDS a per-cart rule setupFutureUsage on the PaymentIntent, so a rule combining flowType pi_first with setupFutureUsage loses that mandate, and a pi_first cart shows and saves NO saved payment methods at all. Per-cart override - flowType in STRIPE_PAYMENT_BEHAVIOR_RULES. An invalid value does not abort startup - it is reported to the deploy log and falls back to deferred, which also means bank transfers and BLIK stop rendering, so check that log after changing this. Blank reads as unset.'
        - key: STRIPE_PAYMENT_BEHAVIOR_RULES
          description: 'Optional JSON map of cart country or commercetools store key to payment behavior overrides. Contains exceptions only - the flat variables above are always the default and there is no wildcard key. Each rule may set flowType ("deferred"|"pi_first"), captureMethod ("automatic"|"automatic_async"|"manual"), setupFutureUsage ("off_session"|"on_session"|""|"none"|"null"|"undefined") and euBankTransferCountry ("DE"|"FR"|"IE"|"NL"). Malformed JSON or a rule that is not an object aborts startup, because there is no per-field fallback for those and every market would silently lose its rule at once. An unknown field or an invalid VALUE does not abort - it is reported to the deploy log and ignored, so that one setting falls back to its default and the rest of the configuration, and the deployment, survive a typo. Example - {"DE":{"captureMethod":"automatic","euBankTransferCountry":"DE"},"MX":{"captureMethod":"manual"}} BANK TRANSFERS - there is deliberately no enable flag here, and there used to be one. Whether bank transfer is offered at all is a Stripe Dashboard payment-method setting for the whole account; whether the widget can render it is STRIPE_PAYMENT_FLOW pi_first. This map only resolves the two conflicts the Dashboard cannot see. FIRST, captureMethod - manual capture and an off_session/on_session setupFutureUsage each remove customer_balance from the methods Stripe resolves, so a merchant running manual capture globally enables bank transfer in one market by giving that market captureMethod "automatic". automatic_async works too. SECOND, euBankTransferCountry - purely optional, and it chooses which of your bank accounts a EUR shopper is told to wire funds to. Omit it and Stripe shows an Irish IBAN, which works for every eurozone shopper because SEPA is a single payment area; set it to show a local IBAN instead, normally to spare the buyer cross-border fees. It applies to EUR carts only and is ignored elsewhere, so one store-key rule spanning several currencies is safe. Neither field is needed by a merchant already on the default automatic capture - for them STRIPE_PAYMENT_FLOW and the Dashboard are the whole configuration.'
        - key: STRIPE_WEBHOOK_ID
          description: Stripe unique identifier for the Webhook Endpoints (example - we_*****).
          required: true
        - key: STRIPE_APPEARANCE_PAYMENT_ELEMENT
          description: Stripe Appearance for Payment Element (example - {"theme":"night","labels":"floating"}).
        - key: STRIPE_APPEARANCE_EXPRESS_CHECKOUT
          description: Stripe Appearance for Express Checkout (example - {"theme":"night","labels":"floating"}).
        - key: STRIPE_LAYOUT
          description: Stripe Layout for Payment Element (example - {"type":"accordion","defaultCollapsed":false,"radios":true,"spacedAccordionItems":false} ).
          default: '{"type":"tabs","defaultCollapsed":false}'
        - key: STRIPE_PUBLISHABLE_KEY
          description: Stripe Publishable Key
          required: true
        - key: STRIPE_APPLE_PAY_WELL_KNOWN
          description: Domain association file from Stripe. (example - https://stripe.com/files/apple-pay/apple-developer-merchantid-domain-association)
        - key: STRIPE_SAVED_PAYMENT_METHODS_CONFIG
          description: Stripe configuration for saved payment methods (example - {"payment_method_save":"enabled","payment_method_save_usage":"off_session","payment_method_redisplay":"enabled","payment_method_redisplay_limit":10}).
          default: '{"payment_method_save":"disabled"}'
        - key: MERCHANT_RETURN_URL
          description: Merchant return URL
          required: true
        - key: STRIPE_COLLECT_BILLING_ADDRESS
          description: Stripe collect billing address information in Payment Element (example - 'auto' | 'never' | 'if_required').
          default: 'auto'
          required: true
        - key: STRIPE_SUBSCRIPTION_PAYMENT_HANDLING
          description: Subscription payment handling strategy (createOrder|addPaymentToOrder).
          default: createOrder
        - key: STRIPE_SUBSCRIPTION_PRICE_SYNC_ENABLED
          description: Enable automatic price synchronization for subscriptions (true|false). When true, prices are synchronized before invoice creation. When false, prices are updated after payment for next billing cycle.
          default: 'false'
        - key: STRIPE_ENABLE_MULTI_OPERATIONS
          description: Enable multicapture and multirefund support (true|false). When enabled, allows multiple partial captures and multiple refunds on payments. IMPORTANT - Requires multicapture to be enabled in your Stripe account.
          default: 'false'
        - key: CT_CUSTOM_TYPE_LAUNCHPAD_PURCHASE_ORDER_KEY
          description: Custom type key for launchpad purchase order number.
          required: true
          default: 'payment-launchpad-purchase-order'
        - key: CT_CUSTOM_TYPE_STRIPE_CUSTOMER_KEY
          description: Custom type key for Stripe customer ID.
          required: true
          default: 'payment-connector-stripe-customer-id'
        - key: CT_CUSTOM_TYPE_SUBSCRIPTION_LINE_ITEM_KEY
          description: Custom type key for subscription line item.
          required: true
          default: 'payment-connector-subscription-line-item-type'
        - key: CT_PRODUCT_TYPE_SUBSCRIPTION_KEY
          description: Product type key for subscription information.
          required: true
          default: 'payment-connector-subscription-information'
      securedConfiguration:
        - key: CTP_CLIENT_SECRET
          description: commercetools client secret.
          required: true
        - key: CTP_CLIENT_ID
          description: commercetools client ID with manage_payments, manage_orders, view_sessions, view_api_clients, manage_checkout_payment_intents, introspect_oauth_tokens, manage_types and view_types scopes
          required: true
        - key: STRIPE_SECRET_KEY
          description: Stripe secret key (example - sk_*****).
          required: true
        - key: STRIPE_WEBHOOK_SIGNING_SECRET
          description: Stripe Webhook signing secret  (example - whsec_*****).
          required: true
